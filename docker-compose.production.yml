version: '3.8'

# ========================================
# Production Docker Compose Configuration
# ========================================
# This configuration is optimized for production deployment
# Use this when deploying to a VPS or cloud VM
#
# For cloud platforms (Vercel, Railway), deploy each service separately
# This file is useful for self-hosted deployments

services:
  # ========================================
  # BACKEND SERVICES
  # ========================================

  media-recording-service:
    build:
      context: ./media-recording-service
      dockerfile: Dockerfile
    container_name: podcasthub_recording_prod
    restart: unless-stopped
    ports:
      - "${RECORDING_PORT:-8001}:8001"
    environment:
      # Application
      ENVIRONMENT: production
      DEBUG: "False"
      HOST: 0.0.0.0
      PORT: 8001

      # Database (use external cloud PostgreSQL)
      POSTGRES_URL: ${POSTGRES_URL}

      # Message Broker (use external cloud RabbitMQ)
      RABBITMQ_URL: ${RABBITMQ_URL}

      # Storage (use external cloud S3/R2)
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_SECURE: "True"
      MINIO_BUCKET: ${MINIO_BUCKET:-recordings}

      # Redis (use external cloud Redis)
      REDIS_URL: ${REDIS_URL}

      # CORS (set to your frontend domain)
      CORS_ORIGINS: ${CORS_ORIGINS}

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - podcasthub_prod
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  media-processing-service:
    build:
      context: ./media-processing-service
      dockerfile: Dockerfile
    container_name: podcasthub_processing_prod
    restart: unless-stopped
    ports:
      - "${PROCESSING_PORT:-8002}:8002"
    environment:
      ENVIRONMENT: production
      DEBUG: "False"
      RABBITMQ_URL: ${RABBITMQ_URL}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - podcasthub_prod
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  media-processing-worker:
    build:
      context: ./media-recording-service
      dockerfile: Dockerfile
    container_name: podcasthub_worker_prod
    restart: unless-stopped
    command: ["python", "-m", "src.processors.media_processing_worker"]
    environment:
      ENVIRONMENT: production
      DEBUG: "False"
      RABBITMQ_URL: ${RABBITMQ_URL}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_SECURE: "True"
      POSTGRES_URL: ${POSTGRES_URL}
    networks:
      - podcasthub_prod
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========================================
  # FRONTEND (Optional - use Vercel in production)
  # ========================================
  # Uncomment if you want to self-host the frontend

  # podcast-frontend:
  #   build:
  #     context: ./podcast-frontend
  #     dockerfile: Dockerfile
  #     args:
  #       NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
  #       NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
  #       NEXT_PUBLIC_TURN_URL: ${NEXT_PUBLIC_TURN_URL}
  #       NEXT_PUBLIC_TURN_USERNAME: ${NEXT_PUBLIC_TURN_USERNAME}
  #       NEXT_PUBLIC_TURN_CREDENTIAL: ${NEXT_PUBLIC_TURN_CREDENTIAL}
  #   container_name: podcasthub_frontend_prod
  #   restart: unless-stopped
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     - media-recording-service
  #   networks:
  #     - podcasthub_prod
  #   logging:
  #     driver: "json-file"
  #     options:
  #       max-size: "10m"
  #       max-file: "3"

  # ========================================
  # REVERSE PROXY (Nginx)
  # ========================================
  # Uncomment if you want SSL termination and load balancing

  # nginx:
  #   image: nginx:alpine
  #   container_name: podcasthub_nginx
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./nginx/ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - media-recording-service
  #     - media-processing-service
  #   networks:
  #     - podcasthub_prod

networks:
  podcasthub_prod:
    driver: bridge

# ========================================
# NOTES FOR PRODUCTION DEPLOYMENT
# ========================================
#
# 1. ENVIRONMENT VARIABLES
#    Create .env.production with all required variables
#    cp .env.production.example .env.production
#    Edit .env.production with your cloud service credentials
#
# 2. CLOUD SERVICES REQUIRED
#    - PostgreSQL: Supabase, Railway, or Neon
#    - RabbitMQ: CloudAMQP
#    - S3/R2: Cloudflare R2, AWS S3, or DigitalOcean Spaces
#    - Redis: Upstash or Redis Cloud
#    - TURN Server: Metered.ca, Xirsys, or self-hosted coturn
#
# 3. SECURITY
#    - Use strong passwords for all services
#    - Enable SSL/TLS for all connections
#    - Set CORS_ORIGINS to your actual domain
#    - Never commit .env.production to git
#    - Use secrets management in production
#
# 4. DEPLOYMENT COMMANDS
#    # Pull latest images
#    docker-compose -f docker-compose.production.yml pull
#
#    # Start services
#    docker-compose -f docker-compose.production.yml up -d
#
#    # View logs
#    docker-compose -f docker-compose.production.yml logs -f
#
#    # Stop services
#    docker-compose -f docker-compose.production.yml down
#
# 5. MONITORING
#    - Set up health check endpoints monitoring
#    - Configure log aggregation (e.g., ELK stack)
#    - Set up alerts for service failures
#    - Monitor resource usage (CPU, memory, disk)
#
# 6. SCALING
#    To scale workers:
#    docker-compose -f docker-compose.production.yml up -d --scale media-processing-worker=3
#
# 7. BACKUPS
#    - Database: Use cloud provider's backup feature
#    - Storage: Enable versioning in S3/R2
#    - Configuration: Version control all configs
