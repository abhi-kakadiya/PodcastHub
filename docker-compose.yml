version: '3.8'

services:
  # RabbitMQ - Message Broker
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: podcasthub_rabbitmq
    ports:
      - "5672:5672"   # AMQP protocol port
      - "15672:15672" # Management UI (http://localhost:15672)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - podcasthub

  # MinIO - S3-Compatible Object Storage
  minio:
    image: minio/minio:latest
    container_name: podcasthub_minio
    ports:
      - "9000:9000"   # API port
      - "9001:9001"   # Console UI (http://localhost:9001)
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - podcasthub

  # PostgreSQL - Database (for storing metadata)
  postgres:
    image: postgres:15-alpine
    container_name: podcasthub_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: podcasthub
      POSTGRES_PASSWORD: podcasthub123
      POSTGRES_DB: podcasthub
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U podcasthub"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - podcasthub

  # Redis - Caching & Session Store
  redis:
    image: redis:7-alpine
    container_name: podcasthub_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - podcasthub

  media-recording-service:
    build:
      context: ./media-recording-service
    container_name: podcasthub_media_recording
    env_file:
      - ./media-recording-service/.env
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      MINIO_ENDPOINT: minio:9000
    ports:
      - "8001:8001"
    depends_on:
      - rabbitmq
      - minio
    restart: unless-stopped
    networks:
      - podcasthub

  media-processing-worker:
    build:
      context: ./media-recording-service
    container_name: podcasthub_media_worker
    command: ["python", "-m", "processors.media_processing_worker"]
    env_file:
      - ./media-recording-service/.env
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      MINIO_ENDPOINT: minio:9000
    depends_on:
      - rabbitmq
      - minio
    restart: unless-stopped
    networks:
      - podcasthub

  media-processing-service:
    build:
      context: ./media-processing-service
    container_name: podcasthub_media_processing
    env_file:
      - ./media-processing-service/.env
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    ports:
      - "8002:8002"
    depends_on:
      - rabbitmq
    restart: unless-stopped
    networks:
      - podcasthub

  podcast-frontend:
    build:
      context: ./podcast-frontend
    container_name: podcasthub_frontend
    env_file:
      - ./podcast-frontend/.env
    environment:
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      - media-recording-service
    restart: unless-stopped
    networks:
      - podcasthub

volumes:
  rabbitmq_data:
    driver: local
  minio_data:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  podcasthub:
    driver: bridge
