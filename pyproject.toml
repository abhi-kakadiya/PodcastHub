[tool.poetry]
name = "FastAPI Boilerplate"
version = "1.0.0"
description = "A web application that helps users discover trending templates, create engaging posts, and schedule content across multiple platforms with AI-driven insights."
authors = ["Abhi <me@abhik.com>"]
packages = [{include = "Boilerplate"}]
license = "MIT"

[tool.poetry.dependencies]
python = "^3.10"
alembic = "^1.9.4"
SQLAlchemy = "^2.0.4"
PyJWT = "^2.6.0"
uvicorn = "^0.20.0"
fastapi = "^0.92.0"
celery = "^5.2.7"
gunicorn = "^20.1.0"
fastapi-event = "^0.1.3"
ujson = "^5.7.0"
click = "^8.1.3"
greenlet = "1.1.3"
redis = "^4.5.4"
pydantic = "^1.10.5"
isort = "^5.12.0"
black = "^23.1.0"
pylint = "^2.16.2"
asyncpg = "^0.27.0"
pytest = "^7.2.1"
httpx = "^0.23.3"
pyyaml = "^6.0"
email-validator = "^1.3.1"
python-jose = "^3.3.0"
cryptography = "^41.0.0"
passlib = "^1.7.4"
faker = "^17.0.0"
pytest-asyncio = "^0.20.3"
sqladmin = {extras = ["full"], version = "^0.20.1"}
bcrypt = "3.2.0"
pytz = "^2025.1"
jinja2 = "^3.1.2"
python-multipart = "^0.0.6"
flower = "^2.0.1"
slowapi = "^0.1.8"
openai = "^1.66.3"
pandas = "^2.2.3"
aiofiles = "^24.1.0"
unidecode = "^1.3.8"
requests = "^2.32.3"
pillow = "^11.1.0"
bs4 = "^0.0.2"
asyncpraw = "^7.8.1"

[tool.poetry.group.dev.dependencies]
behave = "^1.2.6"
black = {version = "^23.1.0", allow-prereleases = true}

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
